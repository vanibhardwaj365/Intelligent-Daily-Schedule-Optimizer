<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Intelligent Daily Schedule Optimizer</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-icon">⚡</div>
                <h2>Schedule<span class="highlight">Optimizer</span></h2>
                <p>Intelligent Daily Task & Schedule Management</p>
            </div>

            <!-- Tab Switcher -->
            <div class="tab-switch">
                <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">Sign In</button>
                <button id="tab-register" class="tab-btn" onclick="switchTab('register')">Register</button>
            </div>

            <!-- Alert Box -->
            <div id="auth-alert" class="alert-box" style="display: none;"></div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-username">Username or Email</label>
                    <input type="text" id="login-username" placeholder="Enter username (e.g. demo)" required autofocus>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign In to Dashboard</button>

                <div class="demo-box">
                    <strong>Demo Credentials:</strong><br>
                    Username: <span class="badge">demo</span> &nbsp;|&nbsp; Password: <span class="badge">admin123</span>
                </div>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form" style="display: none;" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="reg-fullname">Full Name</label>
                    <input type="text" id="reg-fullname" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="reg-username">Username</label>
                    <input type="text" id="reg-username" placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" placeholder="Create a password" required minlength="4">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Create Account</button>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
